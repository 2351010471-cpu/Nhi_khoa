<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luyện trắc nghiệm Nhi khoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: thanh lọc bên trái, vùng làm bài ở giữa; một câu mỗi màn hình */
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#16212E; --muted:#5D6B7A; --line:#D9E0E7;
  --accent:#0B6E79; --accent-soft:#E0F0F1;
  --good:#1D7A43; --good-soft:#E3F3E9; --bad:#B3261E; --bad-soft:#FBE7E5; --warn:#8A5A00; --warn-soft:#FBF1DC;
  --display:"Noto Serif", Georgia, serif; --body:"Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#98A6B5; --line:#2B3744;
  --accent:#4FB7C1; --accent-soft:#163A3F; --good:#5CC58A; --good-soft:#163526; --bad:#F08A80; --bad-soft:#3E1D1B; --warn:#E3B45A; --warn-soft:#3A2E15; color-scheme: dark;}}
:root[data-theme="dark"]{
  --bg:#0F151C; --surface:#18212B; --ink:#E6ECF2; --muted:#98A6B5; --line:#2B3744;
  --accent:#4FB7C1; --accent-soft:#163A3F; --good:#5CC58A; --good-soft:#163526; --bad:#F08A80; --bad-soft:#3E1D1B; --warn:#E3B45A; --warn-soft:#3A2E15; color-scheme: dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:320px 1fr;gap:20px;max-width:1240px;margin:0 auto;padding:20px 16px 40px}
@media (max-width:860px){.app{grid-template-columns:1fr}}
header.top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
aside .panel{display:flex;flex-direction:column;gap:14px}
.grp h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:0 0 6px;font-weight:600}
details.cl{border-top:1px solid var(--line);padding:6px 0}
details.cl summary{cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:600;font-size:14.5px;list-style:none}
details.cl summary::-webkit-details-marker{display:none}
.chev{transition:transform .15s;color:var(--muted)} details[open] .chev{transform:rotate(90deg)}
.les{display:flex;align-items:flex-start;gap:8px;font-size:14px;padding:3px 0 3px 22px}
.les input,.cl summary input{accent-color:var(--accent);margin-top:3px}
.cnt{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:13.5px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
select,input[type=number]{font-family:inherit;font-size:14px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 16px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#0F151C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .btn.primary{color:#0F151C}}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pool{font-size:14px;color:var(--muted)} .pool b{color:var(--ink);font-variant-numeric:tabular-nums}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.prog{flex:1;min-width:160px;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);width:0}
.stat{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.stat b.g{color:var(--good)} .stat b.r{color:var(--bad)}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line);color:var(--muted)}
.tag.bl{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.tag.fl{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.stem{font-family:var(--display);font-size:19px;line-height:1.5;font-weight:500;margin:0 0 14px;max-width:70ch}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 14px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:13.5px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)} .opt.sel .L{border-color:var(--accent);color:var(--accent)}
.opt.ok{border-color:var(--good);background:var(--good-soft)} .opt.ok .L{background:var(--good);border-color:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)} .opt.no .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt:disabled{cursor:default}
.otags{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:14.5px;display:none}
.fb.show{display:block} .fb.g{background:var(--good-soft);color:var(--good)} .fb.r{background:var(--bad-soft);color:var(--bad)} .fb.n{background:var(--warn-soft);color:var(--warn)}
.fb .note{color:var(--ink);margin-top:6px;font-size:14px}
.nav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}
.nav .r{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--muted);font-size:15px}
.dots{display:flex;flex-wrap:wrap;gap:5px}
.dot{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.dot.cur{border-color:var(--accent);border-width:2px;font-weight:700}
.dot.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.dot.no{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.dot.ans{background:var(--accent-soft)}
.res h2{font-family:var(--display);font-size:22px;margin:0 0 4px}
.big{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)} th.n,td.n{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.hint{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div><h1>Luyện trắc nghiệm Nhi khoa</h1><div class="sub">Đề 2022 – 2025 · xếp theo cụm chương bài · có mức Bloom và năm đề</div></div>
    <div class="sub" id="memo"></div>
  </header>
  <aside>
    <div class="panel">
      <div class="grp"><h3>Chương bài</h3>
        <div class="row" style="margin-bottom:4px"><button class="chip" id="allL" type="button">Chọn tất cả</button><button class="chip" id="noneL" type="button">Bỏ chọn</button></div>
        <div id="tree"></div>
      </div>
      <div class="grp"><h3>Mức Bloom</h3><div class="chips" id="bloom"></div></div>
      <div class="grp"><h3>Năm đề</h3><div class="chips" id="year"></div></div>
      <div class="grp"><h3>Cách làm</h3>
        <div class="chips" id="mode"></div>
        <div class="row" style="margin-top:10px"><label for="num">Số câu</label><input id="num" type="number" min="1" value="30" style="width:76px"><label><input type="checkbox" id="shuf" checked> Trộn câu & lựa chọn</label></div>
        <div class="row" style="margin-top:6px"><label><input type="checkbox" id="onlyWrong"> Chỉ các câu từng làm sai</label></div>
      </div>
      <div class="pool" id="pool"></div>
      <button class="btn primary" id="start" type="button">Bắt đầu làm bài</button>
    </div>
  </aside>
  <main>
    <div class="panel" id="stage"></div>
    <div class="panel" id="mapPanel"><div class="grp"><h3>Danh sách câu</h3></div><div class="dots" id="dots"></div></div>
  </main>
</div>

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
// tree
function buildTree(){
  const t=$('tree');t.innerHTML='';
  DATA.clusters.forEach(([cn,ls],ci)=>{
    const d=document.createElement('details');d.className='cl';if(ci<1)d.open=true;
    const n=ls.reduce((a,[id])=>a+DATA.q.filter(q=>q.l===id).length,0);
    d.innerHTML=`<summary><span class="chev">▸</span><input type="checkbox" id="c${ci}" aria-label="Chọn cụm ${esc(cn)}">${esc(cn)}<span class="cnt">${n}</span></summary>`+
      ls.map(([id,ln])=>`<label class="les"><input type="checkbox" id="l-${id}" data-l="${id}">${esc(ln)}<span class="cnt">${DATA.q.filter(q=>q.l===id).length}</span></label>`).join('');
    t.appendChild(d);
    const cb=d.querySelector('#c'+ci);
    cb.addEventListener('click',e=>{e.stopPropagation()});
    cb.addEventListener('change',()=>{ls.forEach(([id])=>cb.checked?sel.les.add(id):sel.les.delete(id));sync()});
    d.querySelectorAll('[data-l]').forEach(x=>x.addEventListener('change',()=>{x.checked?sel.les.add(x.dataset.l):sel.les.delete(x.dataset.l);sync()}));
  });
}
function chips(el,items,set,lab){
  el.innerHTML=items.map(v=>`<button type="button" class="chip" data-v="${v}">${esc(lab(v))}</button>`).join('');
  el.querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{let v=b.dataset.v;if(set===sel.bloom)v=+v;set.has(v)?set.delete(v):set.add(v);sync()}));
}
function modeChips(){
  const m=[['practice','Luyện tập – chấm ngay'],['exam','Thi thử – chấm cuối bài']];
  $('mode').innerHTML=m.map(([v,l])=>`<button type="button" class="chip" data-v="${v}">${l}</button>`).join('');
  $('mode').querySelectorAll('.chip').forEach(b=>b.addEventListener('click',()=>{sel.mode=b.dataset.v;sync()}));
}
function pool(){return DATA.q.filter(q=>sel.les.has(q.l)&&sel.bloom.has(q.b)&&q.y.some(y=>sel.year.has(y))&&(!$('onlyWrong').checked||store.wrong[q.id]))}
function sync(){
  DATA.clusters.forEach(([cn,ls],ci)=>{const on=ls.filter(([id])=>sel.les.has(id)).length;const cb=$('c'+ci);cb.checked=on===ls.length;cb.indeterminate=on>0&&on<ls.length;ls.forEach(([id])=>$('l-'+id).checked=sel.les.has(id))});
  $('bloom').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',sel.bloom.has(+b.dataset.v)));
  $('year').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',sel.year.has(b.dataset.v)));
  $('mode').querySelectorAll('.chip').forEach(b=>b.setAttribute('aria-pressed',sel.mode===b.dataset.v));
  const p=pool();$('pool').innerHTML=`Có <b>${p.length}</b> câu phù hợp bộ lọc.`;
  $('start').disabled=!p.length;
  const w=Object.keys(store.wrong).length;$('memo').textContent=w?`Đang lưu ${w} câu bạn từng làm sai`:'';
}
$('allL').onclick=()=>{Object.keys(LN).forEach(k=>k!=='INC'&&sel.les.add(k));sync()};
$('noneL').onclick=()=>{sel.les.clear();sync()};

// session
let S=null;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(){
  let p=pool();const sh=$('shuf').checked;if(sh)p=shuffle(p);
  const n=Math.max(1,Math.min(p.length,parseInt($('num').value)||p.length));p=p.slice(0,n);
  S={mode:sel.mode,items:p.map(q=>{let ord=q.o.map((_,i)=>i);if(sh&&!q.o.some(o=>/tất cả|các dấu hiệu trên|cả hai/i.test(o.t)))ord=shuffle(ord);return{q,ord,pick:[],done:false}}),i:0,finished:false};

}
$('start').onclick=start;
function graded(it){return it.q.k.length>0}

function render(){

  if(S.finished)return renderResult();
  const it=S.items[S.i],q=it.q,multi=q.k.length>1;
  const answered=S.mode==='practice'?it.done:false;
  const yrs=q.y.map(y=>YL[y]||y).join(', ');
  let h=`<div class="bar"><div class="stat">Câu <b>${S.i+1}</b> / ${S.items.length}</div><div class="prog"><i style="width:${(S.items.filter(x=>x.done||x.pick.length).length/S.items.length*100).toFixed(1)}%"></i></div>${S.mode==='practice'?`<div class="stat">Đúng <b class="g">${S.items.filter(x=>x.done&&graded(x)&&correct(x)).length}</b> · Sai <b class="r">${S.items.filter(x=>x.done&&graded(x)&&!correct(x)).length}</b></div>`:''}</div>`;
  h+=`<div class="meta" style="margin-top:12px"><span class="tag bl">Bloom ${q.b} – ${BL[q.b]}</span><span class="tag">${esc(LN[q.l]||'')}</span><span class="tag">Năm: ${esc(yrs)}</span><span class="tag">${esc(q.e)}</span>${q.f.map(f=>`<span class="tag fl">${f==='hoàn thiện'?'Câu hoàn thiện':'Đã chỉnh lựa chọn'}</span>`).join('')}</div>`;
  h+=`<p class="stem">${esc(q.s)}</p>`;

    h+=`<button class="btn" id="reveal" type="button">Xem đáp án</button><div class="fb n ${it.done?'show':''}"><b>Đáp án:</b> ${esc(q.r)}${q.n.map(n=>`<div class="note">${esc(n)}</div>`).join('')}</div>`;
  }else{
    if(multi)h+=`<p class="hint" style="margin-top:-6px">Câu này có ${q.k.length} đáp án đúng, chọn đủ rồi bấm Kiểm tra.</p>`;

      if(it.pick.includes(oi))c='sel';
      if(show&&graded(it)){if(q.k.includes(oi))c='ok';else if(it.pick.includes(oi))c='no'}
      const tg=show&&o.g.length?`<span class="otags">${o.g.map(esc).join(' · ')}</span>`:'';
      return `<button type="button" class="opt ${c}" data-oi="${oi}" ${show?'disabled':''}><span class="L">${'ABCD'[pos]}</span><span>${esc(o.t)}${tg}</span></button>`}).join('')+`</div>`;
    if(S.mode==='practice'&&it.done){
      let cls='n',msg='';
      if(!graded(it))msg='Câu này chưa có đáp án được xác nhận trong đề gốc. Các đánh dấu của từng bản được ghi dưới mỗi lựa chọn.';
      else if(correct(it)){cls='g';msg='Chính xác.'}else{cls='r';msg='Chưa đúng. Đáp án: '+q.k.map(k=>'ABCD'[it.ord.indexOf(k)]).join(', ')+'.'}
      if(q.ks)msg+=` (${q.ks})`;
      h+=`<div class="fb ${cls} show">${esc(msg)}${q.n.map(n=>`<div class="note">${esc(n)}</div>`).join('')}</div>`;
    }
  }
  const last=S.i===S.items.length-1;
  h+=`<div class="nav"><button class="btn" id="prev" type="button" ${S.i?'':'disabled'}>← Câu trước</button><div class="r">`;
  if(S.mode==='practice'&&multi&&!it.done&&q.r==null)h+=`<button class="btn primary" id="check" type="button" ${it.pick.length?'':'disabled'}>Kiểm tra</button>`;
  h+=last?`<button class="btn primary" id="finish" type="button">${S.mode==='exam'?'Nộp bài':'Xem kết quả'}</button>`:`<button class="btn ${S.mode==='practice'&&!it.done?'':'primary'}" id="next" type="button">Câu tiếp →</button>`;
  h+=`</div></div>`;
  st.innerHTML=h;
  st.querySelectorAll('.opt').forEach(b=>b.addEventListener('click',()=>pick(+b.dataset.oi)));
  if($('reveal'))$('reveal').onclick=()=>{it.done=true;render()};
  if($('check'))$('check').onclick=()=>finishItem(it);
  if($('prev'))$('prev').onclick=()=>{S.i--;render()};
  if($('next'))$('next').onclick=()=>{S.i++;render()};
  if($('finish'))$('finish').onclick=()=>{S.items.forEach(x=>{if(S.mode==='exam'&&x.pick.length)finishItem(x,true)});S.finished=true;render()};
}
function finishItem(it,silent){
  it.done=true;
  if(graded(it)){if(correct(it))delete store.wrong[it.q.id];else store.wrong[it.q.id]=1;save()}
  if(!silent)render();
}
function pick(oi){
  const it=S.items[S.i],multi=it.q.k.length>1;
  if(multi){it.pick.includes(oi)?it.pick=it.pick.filter(x=>x!==oi):it.pick.push(oi);render();return}
  it.pick=[oi];
  if(S.mode==='practice')finishItem(it);else render();
}
function renderDots(){
  const d=$('dots');$('mapPanel').style.display=S?'':'none';if(!S)return;
  d.innerHTML=S.items.map((it,i)=>{let c='';const showRes=S.mode==='practice'||S.finished;
    if(showRes&&it.done&&graded(it))c=correct(it)?'ok':'no';else if(it.pick.length||it.done)c='ans';
    return `<button type="button" class="dot ${c} ${i===S.i&&!S.finished?'cur':''}" data-i="${i}" aria-label="Câu ${i+1}">${i+1}</button>`}).join('');
  d.querySelectorAll('.dot').forEach(b=>b.onclick=()=>{S.finished=false;S.i=+b.dataset.i;if(S.mode==='exam'&&S.items.some(x=>x.done))S.mode='practice';render()});
}
function renderResult(){
  const g=S.items.filter(graded),ok=g.filter(x=>x.done&&correct(x)).length,skip=g.filter(x=>!x.pick.length).length;
  const by={};g.forEach(x=>{const k=x.q.l;by[k]=by[k]||[0,0];by[k][1]++;if(x.done&&correct(x))by[k][0]++});
  const bb={};g.forEach(x=>{const k=x.q.b;bb[k]=bb[k]||[0,0];bb[k][1]++;if(x.done&&correct(x))bb[k][0]++});
  const pct=g.length?Math.round(ok/g.length*100):0;
  let h=`<div class="res"><h2>Kết quả</h2><div class="row" style="gap:18px;align-items:center"><div class="big">${ok}/${g.length}</div><div class="stat">${pct}% đúng${skip?` · ${skip} câu bỏ trống`:''}<br>Bấm vào ô số ở dưới để xem lại từng câu.</div></div>`;
  h+=`<div class="tw" style="margin-top:14px"><table><thead><tr><th>Bài</th><th class="n">Đúng</th><th class="n">Tổng</th><th class="n">%</th></tr></thead><tbody>`+
    Object.entries(by).map(([k,[a,b]])=>`<tr><td>${esc(LN[k])}</td><td class="n">${a}</td><td class="n">${b}</td><td class="n">${Math.round(a/b*100)}</td></tr>`).join('')+`</tbody></table></div>`;
  h+=`<div class="tw" style="margin-top:12px"><table><thead><tr><th>Mức Bloom</th><th class="n">Đúng</th><th class="n">Tổng</th><th class="n">%</th></tr></thead><tbody>`+
    Object.entries(bb).sort().map(([k,[a,b]])=>`<tr><td>${k} – ${BL[k]}</td><td class="n">${a}</td><td class="n">${b}</td><td class="n">${Math.round(a/b*100)}</td></tr>`).join('')+`</tbody></table></div>`;
  const wrongItems=g.filter(x=>!(x.done&&correct(x)));
  h+=`<div class="nav"><button class="btn" id="again" type="button">Làm bộ câu mới</button>${wrongItems.length?`<button class="btn primary" id="redo" type="button">Làm lại ${wrongItems.length} câu sai</button>`:''}</div></div>`;
  $('stage').innerHTML=h;
  $('again').onclick=start;
  if($('redo'))$('redo').onclick=()=>{S={mode:S.mode,items:wrongItems.map(x=>({q:x.q,ord:x.ord,pick:[],done:false})),i:0,finished:false};render()};
}
buildTree();
chips($('bloom'),[1,2,3,4],sel.bloom,v=>v+' – '+BL[v]);
chips($('year'),YEARS,sel.year,v=>YL[v]||v);
modeChips();sync();render();
</script>
